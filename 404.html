<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Tessera</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --grout:#D9D6CC; --ink:#15171C; --muted:#4F5258; }
  @media (prefers-color-scheme: dark) { :root { --grout:#12151A; --ink:#ECE9DE; --muted:#A3A6AD; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--grout); color:var(--ink); font-family:system-ui,"Segoe UI",sans-serif; padding:24px; }
  main { max-width:30rem; }
  .tiles { display:grid; grid-template-columns:repeat(4,44px); gap:6px; margin-bottom:28px; }
  .tiles i { display:block; aspect-ratio:1; border-radius:3px; }
  h1 { font-family:Georgia,"Iowan Old Style",serif; font-weight:400; font-size:clamp(2.2rem,7vw,3.4rem); line-height:1; margin:0 0 14px; }
  p { color:var(--muted); line-height:1.6; margin:0 0 22px; }
  a { display:inline-block; background:#15171C; color:#F1EDE0; text-decoration:none; font-weight:600; padding:11px 18px; border-radius:4px; }
  a:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
</style>
</head>
<body>
<main>
  <div class="tiles" aria-hidden="true">
    <i style="background:#23378F"></i><i style="background:#D69A1F"></i><i style="background:#2F6B3F"></i><i style="background:#B8352B"></i>

  </div>

  <p>The page you asked for doesn't exist. It may have moved, or the link may have a typo.</p>

</main>
</body>
</html>
